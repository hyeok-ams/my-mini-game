<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 주석  ↑반응형 웹페이지에 꼭 필요한 내용 -->
  <link rel="stylesheet" href="/css/style.css">

  <title>나의 첫 Spring Boot 웹페이지</title>
</head>
<body>

	<h1>안녕하세요, 미니게임!</h1> <!-- 홈페이지 주석 주석은 메모 -->
	<h2>안녕하세요, 미니게임!</h2> <!-- 실제 화면 구조 상관없음 -->
	<h3>글자가 작아져요</h3>	  <!-- 웹브라우저가 자동 제거해버림 -->
	<h4>글자가 작아져요</h4>	  <!-- <h~> 무조건 <p> 포함 -->
	<h5>글자가 작아져요</h5>	  <!-- <hr>은 정식태그는 <hr/> -->
	<h6>글자가 작아져요</h6>	  <!-- <태그> </태그> 내용물 없음 <태그 /> -->
	<hr> 한줄선 넣기</hr>
	<hr/>
	<p>Spring Boot 서버에서 HTML을 실행했습니다.</p>
	<script>console.log("여기가 끝!")</script>
	<script src="/js/game.js"></script>
</body>
</html>
